[package]
name = "marvis"
version = "0.1.0"
description = "A focused workspace for repositories and checkouts"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
notify = "8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
