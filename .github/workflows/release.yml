name: Release

# Tag releases reuse CI against the tag SHA, then build and publish artifacts for that same SHA.
on:
  push:
    tags:
      - "v*"
  # Safe end-to-end check: this runs checks/builds but never publishes.
  workflow_dispatch:
    inputs:
      tag:
        description: v-prefixed version to validate without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag ref and source commit
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run the dry run from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          local_sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == push ]]; then
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object | [.type, .sha] | @tsv')"
            IFS=$'\t' read -r object_type object_sha <<< "$object"
            while [[ "$object_type" == tag ]]; do
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object | [.type, .sha] | @tsv')"
              IFS=$'\t' read -r object_type object_sha <<< "$object"
            done

            if [[ "$object_type" != commit || "$object_sha" != "$local_sha" ]]; then
              echo "$RELEASE_TAG resolves remotely to $object_type $object_sha, not validated commit $local_sha" >&2
              exit 1
            fi
          fi

          echo "sha=$local_sha" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_TAG at $local_sha"
      - name: Check tag matches package manifests
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tagVersion = process.env.RELEASE_TAG.slice(1);
          const cargoVersion = fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
            .match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];
          const manifests = [
            ['package.json', JSON.parse(fs.readFileSync('package.json', 'utf8')).version],
            ['src-tauri/tauri.conf.json', JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version],
            ['src-tauri/Cargo.toml', cargoVersion],
          ];
          for (const [path, manifestVersion] of manifests) {
            if (manifestVersion !== tagVersion) {
              throw new Error(`${process.env.RELEASE_TAG} does not match ${path} version ${manifestVersion}`);
            }
          }
          NODE

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
    permissions:
      contents: read

  build:
    needs: [checks, version]
    permissions:
      contents: read
    strategy:
      # One platform failing must not take the other's artifacts down with it.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (aarch64); release builds do not target Intel macOS.
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # The .deb and the AppImage both come out of the one build; the matrix entry only pins
          # the runner, since tauri.conf.json already asks for every target the host supports.
          # Pinned, not ubuntu-latest: AppImage bundling wants the pre-t64 package names, and the
          # newer images are on the t64 ones.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the Tauri Linux prerequisites
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            libgtk-3-0
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.AppImage
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      # Only this job creates the GitHub Release and uploads the built artifacts.
      contents: write
    steps:
      - name: Verify remote release tag still points to validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VALIDATED_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object | [.type, .sha] | @tsv')"
          IFS=$'\t' read -r object_type object_sha <<< "$object"
          while [[ "$object_type" == tag ]]; do
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object | [.type, .sha] | @tsv')"
            IFS=$'\t' read -r object_type object_sha <<< "$object"
          done

          if [[ "$object_type" != commit || "$object_sha" != "$VALIDATED_SHA" ]]; then
            echo "$RELEASE_TAG moved: remote resolves to $object_type $object_sha, validated commit is $VALIDATED_SHA" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find release-assets -type f -print0)
          if ((${#files[@]} == 0)); then
            echo 'No release artifacts were downloaded.' >&2
            exit 1
          fi
          gh release create --repo "$GITHUB_REPOSITORY" "$RELEASE_TAG" "${files[@]}" \
            --verify-tag --title "Marvis $RELEASE_TAG" --generate-notes
