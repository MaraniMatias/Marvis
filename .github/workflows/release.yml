name: Release

# Pushing a tag builds the app and publishes it as a GitHub Release. CI already runs on main,
# so this only builds: gating on the checks here would rebuild the same commit twice.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      # Lets GITHUB_TOKEN create the release and upload the bundles. Declared here so it works
      # even while the repository's default workflow permission is read-only.
      contents: write
    runs-on: macos-latest # Apple Silicon, so the app builds for the host natively.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Marvis ${{ github.ref_name }}"
          generateReleaseNotes: true
          args: "--target aarch64-apple-darwin"
