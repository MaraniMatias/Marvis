name: Release

# Tag releases reuse CI against the tag SHA, then build and publish artifacts for that same SHA.
on:
  push:
    tags:
      - "v*"
  # Safe end-to-end check: this runs checks/builds but never publishes.
  workflow_dispatch:
    inputs:
      tag:
        description: v-prefixed version to validate without publishing
        required: true
        type: string

permissions:
  contents: read

# One release at a time, and never interrupted halfway: a run that is cancelled after it has
# created the release leaves a tag with no artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate tag ref and source commit
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run the dry run from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          local_sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == push ]]; then
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object | [.type, .sha] | @tsv')"
            IFS=$'\t' read -r object_type object_sha <<< "$object"
            while [[ "$object_type" == tag ]]; do
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object | [.type, .sha] | @tsv')"
              IFS=$'\t' read -r object_type object_sha <<< "$object"
            done

            if [[ "$object_type" != commit || "$object_sha" != "$local_sha" ]]; then
              echo "$RELEASE_TAG resolves remotely to $object_type $object_sha, not validated commit $local_sha" >&2
              exit 1
            fi
          fi

          echo "sha=$local_sha" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_TAG at $local_sha"
      - name: Check tag matches package manifests
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        # The same script CI runs on every pull request, so the manifests cannot drift unnoticed
        # and only fail here, at the moment a tag cannot be taken back.
        run: node scripts/release.mjs --check "$RELEASE_TAG"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
    permissions:
      contents: read

  build:
    needs: [checks, version]
    permissions:
      contents: read
    strategy:
      # One platform failing must not take the other's artifacts down with it.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (aarch64); release builds do not target Intel macOS.
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # The .deb and the AppImage both come out of the one build; the matrix entry only pins
          # the runner, since tauri.conf.json already asks for every target the host supports.
          # Pinned, not ubuntu-latest: AppImage bundling wants the pre-t64 package names, and the
          # newer images are on the t64 ones.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          # Arm64 desktop Linux, on GitHub's native arm64 runner, which is free in a public
          # repository. Same 22.04 image as the job above, so the same pre-t64 package names and
          # the same prerequisites step cover both.
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      # pnpm before node: `cache: pnpm` shells out to pnpm to find the store, so a pnpm that is not
      # installed yet fails the step instead of skipping the cache.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      # The release is the one build that cannot skip work, and the Rust dependencies are most of
      # it: they only change when Cargo.lock does, so a warm cache is the difference between a
      # few minutes and a cold compile of the whole graph.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install the Tauri Linux prerequisites
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            libgtk-3-0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:app -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.AppImage
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, version]
    runs-on: ubuntu-24.04
    permissions:
      # Only this job creates the GitHub Release and uploads the built artifacts.
      contents: write
    steps:
      # Only the changelog, and only to read the notes from it: this job builds nothing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          sparse-checkout: /CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Verify remote release tag still points to validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VALIDATED_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object | [.type, .sha] | @tsv')"
          IFS=$'\t' read -r object_type object_sha <<< "$object"
          while [[ "$object_type" == tag ]]; do
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object | [.type, .sha] | @tsv')"
            IFS=$'\t' read -r object_type object_sha <<< "$object"
          done

          if [[ "$object_type" != commit || "$object_sha" != "$VALIDATED_SHA" ]]; then
            echo "$RELEASE_TAG moved: remote resolves to $object_type $object_sha, validated commit is $VALIDATED_SHA" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          # Excluded by name so re-running this step in the same workspace cannot sum the previous
          # run's checksums and then upload them twice.
          mapfile -t assets < <(find . -type f ! -name SHA256SUMS -print | sed 's|^\./||' | sort)
          if ((${#assets[@]} == 0)); then
            echo 'No release artifacts were downloaded.' >&2
            exit 1
          fi
          # Summed from inside each file's own directory so the record names the file and not the
          # build path it happened to sit under: `merge-multiple` keeps the artifact's directories,
          # and a downloader has a flat folder, so `sha256sum -c SHA256SUMS` has to match that.
          : > SHA256SUMS
          for asset in "${assets[@]}"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")") >> SHA256SUMS
          done
          files=(release-assets/SHA256SUMS)
          for asset in "${assets[@]}"; do files+=("release-assets/$asset"); done
          cd "$GITHUB_WORKSPACE"

          # The curated section for this version, when there is one. `gh` prepends it to the notes it
          # generates, so the summary leads and the commit list still follows.
          notes=()
          if [[ -f CHANGELOG.md ]]; then
            curated="$(awk -v version="${RELEASE_TAG#v}" '
              $0 == "## " version { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md)"
            if [[ -n "$curated" ]]; then notes=(--notes "$curated"); fi
          fi

          # Published rather than a draft: a draft never appears in the releases list, so a tag
          # whose draft is left alone keeps the previous release as the latest one. What could make
          # these artifacts wrong is already settled above: the tag still resolves to the validated
          # commit, and every platform in the matrix built them.
          gh release create --repo "$GITHUB_REPOSITORY" "$RELEASE_TAG" "${files[@]}" \
            --verify-tag --title "Marvis $RELEASE_TAG" --generate-notes "${notes[@]}"
