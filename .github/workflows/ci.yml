name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  # Branch-scoped so a release tag only runs release.yml, instead of building the same commit here too.
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # pnpm before node: `cache: pnpm` shells out to pnpm to find the store, so a pnpm that is not
      # installed yet fails the step instead of skipping the cache.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      # The Rust dependencies are the build's cost, and they only change when Cargo.lock does.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm lint:rust
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:security
      - run: pnpm test:coverage
      - run: pnpm build:app
      # Expected upstream block: glib 0.18.5 (RUSTSEC-2024-0429 / GHSA-WRW7-89JP-8Q8G), pulled by GTK 0.18.
      # The fixed glib 0.20 line is not currently GTK-compatible; keep this gate fail-closed, with no allowlist.
      - run: pnpm audit:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

  # macOS never compiles the Linux branches of the code or links webkit2gtk, so nothing above would
  # notice them rotting. This only builds the .deb: proving the app can be packaged for the platform
  # it ships to is the point, and the tests are platform-independent enough to run once.
  linux-build:
    # Pinned, not ubuntu-latest: AppImage bundling wants the pre-t64 package names, and the newer
    # images are on the t64 ones.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install the Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build:app -- --bundles deb
      - run: pnpm audit:rust
